    education:
      - institution: Institut Lumière Matière, Université de Lyon
        location: Lyon, France
        url: https://ilm.univ-lyon1.fr/?&lang=2
        area: Physics, Material
        degree: PhD
        start_date: 2021
        end_date: 2024
        highlights:
          - "Thesis: 'Nanofluidics with Soap Bubbles and Surfactants'" 
          - "Advisor: Dr. [Anne-Laure Biance](https://sites.google.com/view/biance/home-page)"
          - Investigated the motion of an air bubble surrounded by ionic surfactants under an electric field.
          - Derived a physical model for the bubble motion.
          - Stuided colloid filtration/seiving using bubble-in-capillary configuration.
          - Investigated "electronic" surfactants' pi-stacking signature at water/air interface using Langmuir Trough and Ellipsometer combined setup.
          - Built a setup to measure conductivity of pi-stacked surfactants and graphene flakes at water/air interface.

      - institution: KyungHee University
        location: Yongin, South Korea
        area: Mechanical Engineering
        degree: M.E.
        start_date: 2018
        end_date: 2020
        maindescription: 
        highlights:
          - "Thesis: 'Penetration Dynamics of Water Droplet on Janus Mesh'"
          - "Advisor: Prof. [Choongyeop Lee](https://ifluid.khu.ac.kr/home)"
          - Investigated on drop impact dynamics on engineered surfaces such as superhydrophobic(SHPo) surfaces, Lubricant-infused surfaces(LIS), Janus membrane, etc.
          - Developed models for penetration dynamics of water droplets on Janus membrane.
          - Studied a contact time reudction on a curved superhydrophobic surface during drop impact.
          - Demonstrated rebound and rotation phenomena on a inclined LIS.


      - institution: KyungHee University
